<script>
    // LIST LAGU - CUKUP EDIT DI SINI SEKALI SAJA
    // Masukkan nama file asli yang ada di folder 'musik' kamu
    const playlist = [
        "Arabic.mp3",
        "Benciku sangka sayang.mp3",
        "Evi Tamala Aku rindu padamu.mp3",
        "posang.mp3"
    ];

    let currentTrack = 0;
    const player = document.getElementById('audioPlayer');
    const songLabel = document.getElementById('songName');

    function loadTrack(index) {
        const fileName = playlist[index];
        player.src = fileName;
        // Menampilkan nama file sebagai judul (menghapus ".mp3")
        songLabel.innerText = fileName.replace('.mp3', '').toUpperCase();
        player.play().catch(e => console.log("Menunggu interaksi..."));
    }

    function changeSong(direction) {
        currentTrack += direction;
        if (currentTrack < 0) currentTrack = playlist.length - 1;
        if (currentTrack >= playlist.length) currentTrack = 0;
        loadTrack(currentTrack);
    }

    // Inisialisasi awal
    songLabel.innerText = playlist[0].replace('.mp3', '').toUpperCase();
    player.src = playlist[0];
</script>
