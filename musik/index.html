<script>
    // DAFTAR LAGU BERSIH - TANPA POSANG & SUARA
    const playlist = [
        "Arabic.mp3",
        "Benciku sangka sayang.mp3",
        "Evi Tamala Aku rindu padamu.mp3",
        "musik.mp3"
    ];

    let current = 0;
    const audio = document.getElementById('audio');
    const title = document.getElementById('title');

    function load(index) {
        if(playlist[index]) {
            audio.src = playlist[index];
            title.innerText = playlist[index].replace('.mp3', '').toUpperCase();
            audio.play();
        }
    }

    function changeSong(dir) {
        current = (current + dir + playlist.length) % playlist.length;
        load(current);
    }

    // Inisialisasi awal
    title.innerText = playlist[0].replace('.mp3', '').toUpperCase();
    audio.src = playlist[0];
</script>
