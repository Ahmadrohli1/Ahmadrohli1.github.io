<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROHLI HD PLAYER</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0a0a; color: #fff; font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; }
        
        .container { width: 90%; max-width: 350px; background: #1a1a1a; padding: 25px; border-radius: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: center; }
        
        .header { font-size: 12px; letter-spacing: 2px; color: #888; margin-bottom: 20px; }
        
        .album-art { width: 100%; aspect-ratio: 1/1; background: linear-gradient(45deg, #333, #111); border-radius: 20px; margin-bottom: 25px; display: flex; align-items: center; justify-content: center; overflow: hidden; border: 1px solid #333; }
        .album-art img { width: 100%; height: 100%; object-fit: cover; }

        .song-info { margin-bottom: 25px; }
        .song-info h1 { font-size: 20px; margin-bottom: 5px; }
        .song-info p { color: #1DB954; font-size: 14px; }

        audio { width: 100%; filter: invert(100%) hue-rotate(180deg) brightness(1.5); }
        
        .footer { margin-top: 20px; font-size: 10px; color: #444; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">BOOST YOUR SOUND</div>
    
    <div class="album-art">
        <img src="https://via.placeholder.com/300/1DB954/000000?text=ROHLI+OSINT" alt="Cover">
    </div>

    <div class="song-info">
        <h1 id="title">Sedang Memutar...</h1>
        <p>Analyst: Ahmad Rohli</p>
    </div>

    <audio controls id="mainAudio">
        <source src="lagu1.mp3" type="audio/mpeg">
    </audio>

    <div class="footer">HD PLAYER PROJECT | 2026</div>
</div>

<script>
    const audio = document.getElementById('mainAudio');
    const title = document.getElementById('title');
    
    // Ambil nama file dari src dan tampilkan sebagai judul
    const fileName = audio.querySelector('source').src.split('/').pop();
    title.innerText = fileName.replace('.mp3', '').toUpperCase();
</script>

</body>
</html>
